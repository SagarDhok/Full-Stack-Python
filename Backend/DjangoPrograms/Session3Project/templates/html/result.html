<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Result</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to bottom right, #ffdee9, #b5fffc);
            font-family: 'Roboto', sans-serif;
            text-align: center;
            padding: 50px;
            color: #333;
        }

        h1, h2 {
            margin: 20px 0;
        }

        .heart {
            font-size: 48px;
            color: red;
            animation: beat 1s infinite;
        }

        .name {
            font-size: 36px;
            font-family: 'Pacifico', cursive;
            color: #ff3c68;
        }

        .gf {
            font-size: 32px;
            color: #fc03a1;
        }

        .age {
            font-size: 28px;
            color: #ff8c42;
        }

        @keyframes beat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart">❤️</div>
        <h1 class="name">Hello, {{ name }} 💫</h1>
        <h2 class="age">Age: {{ age }}</h2>
        <h1 class="gf">GF Name: {{ gf }} 💖</h1>
        <div class="heart">💘</div>
    </div>

</body>
</html>
