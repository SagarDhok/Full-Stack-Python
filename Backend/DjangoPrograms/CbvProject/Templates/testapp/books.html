<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background: #f5f7fa;
            font-family: "Segoe UI", sans-serif;
        }
        .wrapper {
            max-width: 800px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }
        .book-item a {
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            color: #0d6efd;
        }
        .book-item a:hover {
            color: #0a58ca;
        }
        ol {
            padding-left: 20px;
        }
        .book-item {
            padding: 10px 0;
            border-bottom: 1px solid #e2e2e2;
        }
        .book-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>All Books</h1>
        <ol>
            {% for book in books %}
                <li class="book-item">
                    <a href="/{{ book.id }}">{{ book.title }}</a>
                </li>
            {% endfor %}
        </ol>
    </div>
</body>
</html>
